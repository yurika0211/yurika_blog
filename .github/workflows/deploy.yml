name: Build & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      services:
        description: Services to build and deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - backend
          - chat-ai

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.selection.outputs.frontend }}
      backend: ${{ steps.selection.outputs.backend }}
      chat_ai: ${{ steps.selection.outputs.chat_ai }}
      any_changed: ${{ steps.selection.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed components
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - 'DB/**'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'
            chat_ai:
              - 'chat-ai/**'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'

      - name: Select services to build
        id: selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SERVICES: ${{ inputs.services }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          CHAT_AI_CHANGED: ${{ steps.filter.outputs.chat_ai }}
        run: |
          frontend="$FRONTEND_CHANGED"
          backend="$BACKEND_CHANGED"
          chat_ai="$CHAT_AI_CHANGED"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            frontend=false
            backend=false
            chat_ai=false

            case "$SELECTED_SERVICES" in
              all)
                frontend=true
                backend=true
                chat_ai=true
                ;;
              frontend)
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              chat-ai)
                chat_ai=true
                ;;
              *)
                echo "Unsupported service selection: $SELECTED_SERVICES" >&2
                exit 1
                ;;
            esac
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "chat_ai=$chat_ai" >> "$GITHUB_OUTPUT"
          if [ "$frontend" = true ] || [ "$backend" = true ] || [ "$chat_ai" = true ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 构建并推送镜像到 GitHub Container Registry ──
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image_suffix: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
          - name: backend
            context: ./backend
            image_suffix: backend
            changed: ${{ needs.detect-changes.outputs.backend }}
          - name: chat-ai
            context: ./chat-ai
            image_suffix: chat-ai
            changed: ${{ needs.detect-changes.outputs.chat_ai }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: matrix.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_CHAT_API_BASE_URL=${{ secrets.VITE_CHAT_API_BASE_URL }}

  # ── SSH 到服务器拉取镜像并重启服务 ──
  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && needs.detect-changes.outputs.any_changed == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # 登录 GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 定义镜像名（全小写）
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            FRONTEND="ghcr.io/${REPO}-frontend:${{ github.sha }}"
            BACKEND="ghcr.io/${REPO}-backend:${{ github.sha }}"
            CHAT_AI="ghcr.io/${REPO}-chat-ai:${{ github.sha }}"

            SERVICES=""

            if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
              docker pull "$FRONTEND"
              docker image inspect "$FRONTEND" --format 'frontend digest: {{index .RepoDigests 0}}'
              export FRONTEND_IMAGE="$FRONTEND"
              SERVICES="$SERVICES frontend"
            fi

            if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
              docker pull "$BACKEND"
              docker image inspect "$BACKEND" --format 'backend digest: {{index .RepoDigests 0}}'
              export BACKEND_IMAGE="$BACKEND"
              SERVICES="$SERVICES backend"
            fi

            if [ "${{ needs.detect-changes.outputs.chat_ai }}" = "true" ]; then
              docker pull "$CHAT_AI"
              docker image inspect "$CHAT_AI" --format 'chat-ai digest: {{index .RepoDigests 0}}'
              export CHAT_AI_IMAGE="$CHAT_AI"
              SERVICES="$SERVICES chat-ai"
            fi

            # 进入部署目录并更新服务（可通过 GitHub Secret: DEPLOY_PATH 覆盖）
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/blog"
            fi
            cd "$DEPLOY_PATH"

            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "docker-compose.prod.yml not found in $DEPLOY_PATH"
              exit 1
            fi

            # 仅重启有改动的服务；避免前端单独发布时把 backend/chat-ai 依赖也拉起
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps $SERVICES

            # 清理旧镜像
            docker image prune -f

            echo "✅ Deploy complete!"
