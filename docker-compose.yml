# Cloud-safe production deployment
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/db.sql:/docker-entrypoint-initdb.d/10_blog.sql:ro
      - ./chat-ai/dbaccess/db.sql:/docker-entrypoint-initdb.d/20_chat_ai.sql:ro
    ports:
      - "5433:5432"
    networks:
      - internal
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5433/${POSTGRES_DB:-postgres}}
      NODE_ENV: production
    expose:
      - "3001"
    networks:
      - internal
      - frontend
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chat-ai:
    build:
      context: ./chat-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5433/${POSTGRES_DB:-postgres}?sslmode=disable}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_API_URL: ${OPENAI_API_URL:?OPENAI_API_URL is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      SYSTEM_CONTENT: ${SYSTEM_CONTENT:?SYSTEM_CONTENT is required}
      CHAT_PORT: ${CHAT_PORT:-8080}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_WRITE_ENABLED: ${RAG_WRITE_ENABLED:-true}
      OPENAI_EMBEDDING_URL: ${OPENAI_EMBEDDING_URL:-https://api.openai.com/v1/embeddings}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_TOP_K: ${RAG_TOP_K:-6}
    expose:
      - "8080"
    networks:
      - internal
      - frontend
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_CHAT_API_BASE_URL: ${VITE_CHAT_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - frontend
    depends_on:
      - backend
      - chat-ai
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    # DB and backend/chat-ai only — not reachable from outside
    internal: true
  frontend:
    # frontend <-> backend/chat-ai

volumes:
  pgdata:
