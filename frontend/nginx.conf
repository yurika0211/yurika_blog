server {
    listen 80;
    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── OG Tag Server for social media crawlers ──
    # When a social media crawler (Telegram, Discord, Twitter, Facebook, etc.)
    # requests a /post/:id page, proxy to the OG tag server which injects
    # Open Graph meta tags into the HTML for rich link previews.
    location ~ ^/post/\d+ {
        # Detect social media crawlers by User-Agent
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|TelegramBot|Discordbot|Slackbot|Slack-ImgProxy|LinkedInBot|WhatsApp|Google.*snippet|Bytespider|bingbot|Slurp|Pinterest)") {
            proxy_pass http://127.0.0.1:8080;
            break;
        }

        # For regular browsers, serve the SPA shell
        try_files $uri $uri/ /index.html;
    }

    # Serve static files directly
    location / {
        # Try to serve the requested file, then a directory,
        # and finally fall back to index.html for SPA routing.
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell for the SPA. This ensures browsers
    # fetch the latest index and discover new hashed asset filenames.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets with hashed filenames for 1 year
    location ~* \.(?:css|js|woff2?|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep favicon cache short, but do not treat HTML as cacheable.
    location ~* \.ico$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}